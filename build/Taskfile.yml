# build/Taskfile.yml
version: '3'

includes:
  nodejs:
    taskfile: ../development/nodejs/Taskfile.yml
    dir: ../development/nodejs
  console:
    taskfile: ../development/dotnet/console/Taskfile.yml
    dir: ../development/dotnet/console
  windows:
    taskfile: ../development/dotnet/windows/Taskfile.yml
    dir: ../development/dotnet/windows
  framework:
    taskfile: ../development/dotnet/framework/Taskfile.yml
    dir: ../development/dotnet/framework

vars:
  VERSION:
    sh: ./get-version.sh
  FULL_VERSION:
    sh: ./get-version.sh
  ARTIFACT_DIR: _artifacts/{{.VERSION}}

tasks:
  default:
    desc: "Show available build tasks"
    cmds:
      - task --list

  setup:
    desc: "Initial project setup"
    cmds:
      - task: version
      - task: init-dirs
      - task: nodejs:install
      - echo "Setup complete!"

  ci:
    desc: "Full CI pipeline (traditional Task-based)"
    cmds:
      - task: clean
      - task: build-all
      - task: nodejs:test
      - task: test-e2e
      - echo "CI pipeline completed successfully!"

  ci-nuke:
    desc: "Full CI pipeline via Nuke (RFC-0040 - includes test metrics)"
    cmds:
      - task: nuke-ci
      - task: nodejs:test
      - task: test-e2e
      - echo "Nuke CI pipeline completed successfully!"

  version:
    desc: Show current GitVersion
    cmds:
      - 'echo "Version: {{.VERSION}}"'
      - 'echo "Full Version: {{.FULL_VERSION}}"'

  # Nuke Build Integration (RFC-0040)
  nuke-build:
    desc: "Build via Nuke components (RFC-0040)"
    dir: nuke
    cmds:
      - ./build.sh BuildAll --no-logo

  nuke-test:
    desc: "Test via Nuke (includes metric collection)"
    dir: nuke
    cmds:
      - ./build.sh Test --no-logo

  nuke-ci:
    desc: "Full Nuke CI pipeline"
    dir: nuke
    cmds:
      - ./build.sh CI --no-logo

  nuke-clean:
    desc: "Clean via Nuke"
    dir: nuke
    cmds:
      - ./build.sh Clean --no-logo

  init-dirs:
    desc: Initialize build artifact directories
    cmds:
      - mkdir -p {{.ARTIFACT_DIR}}/dotnet/console/bin
      - mkdir -p {{.ARTIFACT_DIR}}/dotnet/desktop/bin
      - mkdir -p {{.ARTIFACT_DIR}}/dotnet/packages
      - mkdir -p {{.ARTIFACT_DIR}}/dotnet/recordings
      - mkdir -p {{.ARTIFACT_DIR}}/dotnet/logs
      - mkdir -p {{.ARTIFACT_DIR}}/web/{dist,recordings,logs,test-reports,test-results}
      - mkdir -p {{.ARTIFACT_DIR}}/pty/{dist,logs}
      - mkdir -p {{.ARTIFACT_DIR}}/_logs
      - echo "✅ Build directories initialized (console + desktop + packages)"

  build-dotnet:
    desc: "Build .NET projects (console + desktop hosts + plugins)"
    deps: [init-dirs]
    cmds:
      - |
        set -euo pipefail
        BUILD_ROOT="$(pwd)"
        echo "Building Console version (Terminal.Gui)..."
        # Build Dungeon.Host.Console to get plugins copied via MSBuild targets
        pushd ../development/dotnet/console/src/host/Dungeon.Host.Console >/dev/null
        dotnet build -c Debug
        CONSOLE_BIN="$(pwd)/bin/Debug/net8.0"
        popd >/dev/null
        # Copy console to artifacts
        mkdir -p "$BUILD_ROOT/_artifacts/{{.VERSION}}/dotnet/console/bin"
        rm -rf "$BUILD_ROOT/_artifacts/{{.VERSION}}/dotnet/console/bin"/*
        cp -r "$CONSOLE_BIN"/* "$BUILD_ROOT/_artifacts/{{.VERSION}}/dotnet/console/bin/"
        echo "✅ Console version built and copied"

        echo "Copying Plate plugins to artifacts if present (GoapCkpor + CapabilityOrlia + ModernSatsuma + EdgRogqd)..."
        GOAP_SRC="$BUILD_ROOT/../../../plate-projects/goap-ckpor/dotnet/framework/src/Plate.Plugins.GoapCkpor/bin/Debug/net8.0"
        CAP_SRC="$BUILD_ROOT/../../../plate-projects/capability-orlia/dotnet/src/Plate.Plugins.CapabilityOrlia/bin/Debug/net8.0"
        SATSUMA_SRC="$BUILD_ROOT/../../../plate-projects/modern-satsuma/dotnet/framework/src/Plate.ModernSatsuma/bin/Debug/netstandard2.0"
        EDG_SRC="$BUILD_ROOT/../../../plate-projects/edg-rogqd/dotnet/framework/src/Plate.EdgRogqd/bin/Debug/netstandard2.0"
        PLUGINS_CONSOLE="$BUILD_ROOT/_artifacts/{{.VERSION}}/dotnet/console/bin/plugins"
        PLUGINS_DESKTOP="$BUILD_ROOT/_artifacts/{{.VERSION}}/dotnet/desktop/bin/plugins"
        mkdir -p "$PLUGINS_CONSOLE" "$PLUGINS_DESKTOP"

        # Copy GOAP plugin
        if [ -d "$GOAP_SRC" ]; then
          mkdir -p "$PLUGINS_CONSOLE/Plate.Plugins.GoapCkpor/bin/Debug/net8.0" "$PLUGINS_DESKTOP/Plate.Plugins.GoapCkpor/bin/Debug/net8.0"
          cp -R "$GOAP_SRC"/* "$PLUGINS_CONSOLE/Plate.Plugins.GoapCkpor/bin/Debug/net8.0/" || true
          cp -R "$GOAP_SRC"/* "$PLUGINS_DESKTOP/Plate.Plugins.GoapCkpor/bin/Debug/net8.0/" || true
          echo "✓ Copied Plate.Plugins.GoapCkpor"
        else
          echo "↷ Skipping GoapCkpor (no built outputs at $GOAP_SRC)"
        fi

        # Copy Capability plugin
        if [ -d "$CAP_SRC" ]; then
          mkdir -p "$PLUGINS_CONSOLE/Plate.Plugins.CapabilityOrlia/bin/Debug/net8.0" "$PLUGINS_DESKTOP/Plate.Plugins.CapabilityOrlia/bin/Debug/net8.0"
          cp -R "$CAP_SRC"/* "$PLUGINS_CONSOLE/Plate.Plugins.CapabilityOrlia/bin/Debug/net8.0/" || true
          cp -R "$CAP_SRC"/* "$PLUGINS_DESKTOP/Plate.Plugins.CapabilityOrlia/bin/Debug/net8.0/" || true
          echo "✓ Copied Plate.Plugins.CapabilityOrlia"
        else
          echo "↷ Skipping CapabilityOrlia (no built outputs at $CAP_SRC)"
        fi
        echo "✅ Plate plugin copy step completed (best-effort)"

        echo "Building Desktop version (SadConsole)..."
        # Build Dungeon.Host.SadConsole
        pushd ../development/dotnet/windows/src/host/Dungeon.Host.SadConsole >/dev/null
        dotnet build -c Debug
        DESKTOP_BIN="$(pwd)/bin/Debug/net8.0"
        popd >/dev/null
        # Copy desktop to artifacts
        mkdir -p "$BUILD_ROOT/_artifacts/{{.VERSION}}/dotnet/desktop/bin"
        rm -rf "$BUILD_ROOT/_artifacts/{{.VERSION}}/dotnet/desktop/bin"/*
        cp -r "$DESKTOP_BIN"/* "$BUILD_ROOT/_artifacts/{{.VERSION}}/dotnet/desktop/bin/"
        echo "✅ Desktop version built and copied"
        echo "✅ Both versions available in $BUILD_ROOT/_artifacts/{{.VERSION}}/dotnet/"

  build-web:
    desc: "Build web projects"
    deps: [init-dirs]
    dir: ../development/nodejs
    cmds:
      - pnpm run build 2>&1 | tee ../../build/{{.ARTIFACT_DIR}}/_logs/web-build.log
      - cp -r sites/docs/dist/* ../../build/{{.ARTIFACT_DIR}}/web/dist/

  build-pty:
    desc: "Build PTY service"
    deps: [init-dirs]
    dir: ../development/nodejs/pty-service
    cmds:
      # PTY service is plain JS - copy source files to artifacts and install prod deps in dist
      - |
        echo "Copying PTY service files..." | tee ../../../build/{{.ARTIFACT_DIR}}/_logs/pty-build.log
        cp -v *.js package*.json ../../../build/{{.ARTIFACT_DIR}}/pty/dist/ 2>&1 | tee -a ../../../build/{{.ARTIFACT_DIR}}/_logs/pty-build.log
        # Copy version helper next to server.js for artifact-only runtime
        cp -v ../get-version.js ../../../build/{{.ARTIFACT_DIR}}/pty/dist/ 2>&1 | tee -a ../../../build/{{.ARTIFACT_DIR}}/_logs/pty-build.log || true
        cd ../../../build/{{.ARTIFACT_DIR}}/pty/dist && npm ci --omit=dev 2>&1 | tee -a ../../_logs/pty-build.log

  build-all:
    desc: "Build all components (console, web, pty, framework)"
    deps:
      - build-dotnet
      - build-web
      - build-pty
    cmds:
      - task: framework:pack-and-sync
      - echo "All builds completed for version {{.VERSION}}"
      - task: update-latest

  update-latest:
    desc: "Copy current version to latest directory"
    internal: true
    cmds:
      - rm -rf _artifacts/latest
      - cp -r _artifacts/{{.VERSION}} _artifacts/latest
      - echo "Updated _artifacts/latest to point to version {{.VERSION}}"

  artifacts:sync-from-source:
    desc: "Sync Debug builds into versioned artifacts and update latest"
    cmds:
      - |
        set -euo pipefail
        export PATH="/opt/homebrew/opt/node@20/bin:$PATH"
        VER="{{.VERSION}}"
        ART_ROOT="_artifacts"
        VER_DIR="$ART_ROOT/$VER"
        LATEST_DIR="$ART_ROOT/latest"
        # Create dirs
        mkdir -p "$VER_DIR/dotnet/console/bin" "$VER_DIR/dotnet/desktop/bin" "$VER_DIR/web/dist" "$VER_DIR/pty/dist" "$VER_DIR/_logs"
        # Copy Console version Debug bin
        CONSOLE_BIN="../development/dotnet/console/src/host/Dungeon.Host.Console/bin/Debug/net8.0"
        if [ ! -d "$CONSOLE_BIN" ]; then
          echo "Building Dungeon.Host.Console..."
          (cd ../development/dotnet/console/src/host/Dungeon.Host.Console && dotnet build -c Debug)
        fi
        cp -R "$CONSOLE_BIN"/* "$VER_DIR/dotnet/console/bin/"
        echo "✅ Console version synced"
        # Copy Desktop version Debug bin
        DESKTOP_BIN="../development/dotnet/windows/src/host/Dungeon.Host.SadConsole/bin/Debug/net8.0"
        if [ ! -d "$DESKTOP_BIN" ]; then
          echo "Building Dungeon.Host.SadConsole..."
          (cd ../development/dotnet/windows/src/host/Dungeon.Host.SadConsole && dotnet build -c Debug)
        fi
        cp -R "$DESKTOP_BIN"/* "$VER_DIR/dotnet/desktop/bin/"
        echo "✅ Desktop version synced"
        # Copy docs dist (build if missing)
        WEB_DIST_SRC="../development/nodejs/sites/docs/dist"
        if [ ! -d "$WEB_DIST_SRC" ]; then
          echo "Building docs site..."
          (cd ../development/nodejs/sites/docs && pnpm build)
        fi
        cp -R "$WEB_DIST_SRC"/* "$VER_DIR/web/dist/"
        # Copy PTY service files and install prod deps
        PTY_SRC="../development/nodejs/pty-service"
        cp -f "$PTY_SRC"/*.js "$PTY_SRC"/package*.json ../development/nodejs/get-version.js "$VER_DIR/pty/dist/" 2>/dev/null || true
        (cd "$VER_DIR/pty/dist" && npm ci --omit=dev >/dev/null)
        # Update latest
        rm -rf "$LATEST_DIR" && cp -R "$VER_DIR" "$LATEST_DIR"
        echo "✅ Artifacts synced to $VER_DIR and latest (console + desktop)"

  pm2:stop-artifacts:
    desc: "Stop PM2 services for web/pty/console artifacts"
    cmds:
      - pm2 delete web-artifacts >/dev/null 2>&1 || true
      - pm2 delete pty-artifacts >/dev/null 2>&1 || true
      - pm2 delete console-dungeon >/dev/null 2>&1 || true
      - echo "✅ Stopped PM2 artifact services"

  pm2:start-artifacts:
    desc: "Start web(4321), pty(4041), console(artifacts) via PM2"
    deps:
      - artifacts:sync-from-source
    cmds:
      - |
        set -euo pipefail
        export PATH="/opt/homebrew/opt/node@20/bin:$PATH"
        ROOT="$PWD/_artifacts/latest"
        # Web (static) on 4321
        pm2 start http-server --name web-artifacts --cwd "$ROOT/web/dist" -- -p 4321 -c-1
        # PTY service (ws 4041) with BIN_DIR pointing to console dotnet bin
        PORT=4041 BIN_DIR="$ROOT/dotnet/console/bin" pm2 start server.js --name pty-artifacts --cwd "$ROOT/pty/dist"
        # Console host headless with ws 4042 to avoid conflict
        TERM=xterm-256color DUNGEON_HEADLESS=1 DUNGEON_WS_PORT=4042 pm2 start ./Dungeon.Host.Console --name console-dungeon --cwd "$ROOT/dotnet/console/bin" --interpreter none
        pm2 save || true
        echo "✅ PM2 services started: web(4321), pty(4041), console(ws4042)"

  pm2:restart-artifacts:
    desc: "Restart PM2 artifact services (re-sync artifacts first)"
    deps:
      - pm2:stop-artifacts
      - pm2:start-artifacts
    cmds:
      - echo "✅ PM2 artifact services restarted"

  console:debug:
    desc: "Run ConsoleDungeon.Host from latest artifact in DEBUG_MINIMAL_UI"
    deps:
      - build-all
    cmds:
      - ./test-tools/run-debug-mode.sh

  console:normal:
    desc: "Run ConsoleDungeon.Host from latest artifact (full UI)"
    deps:
      - build-all
    cmds:
      - ./test-tools/run-normal-mode.sh

  console:bot:
    desc: "Run ConsoleDungeon.Host with bot-controlled player (automated testing)"
    deps:
      - build-all
      - artifacts:sync-from-source
    cmds:
      - ./test-tools/run-bot-mode.sh {{.CLI_ARGS | default "30"}}

  console:bot-long:
    desc: "Run 5-minute bot session for extended testing"
    deps:
      - build-all
      - artifacts:sync-from-source
    cmds:
      - ./test-tools/run-bot-mode.sh 300

  console:bot-record:
    desc: "Run bot mode with asciinema recording"
    deps:
      - build-all
      - artifacts:sync-from-source
    cmds:
      - ./test-tools/run-bot-with-recording.sh {{.CLI_ARGS | default "60"}}

  bot:capture:
    desc: "Run bot mode and capture complete state (screenshots, logs, recordings)"
    deps:
      - build-all
      - artifacts:sync-from-source
    cmds:
      - |
        echo "🤖 Starting bot mode with state capture..."
        export ENABLE_BOT_MODE=1
        task capture:state
        echo "✅ Bot gameplay captured"

  clean:
    desc: Clean build artifacts and Task cache
    cmds:
      - rm -rf _artifacts/* .task/

  verify:console:
    desc: "Run ConsoleDungeon tests"
    dir: ../development/dotnet/console
    cmds:
      - bash -lc 'TERM=xterm-256color dotnet test Console.sln'

  verify:web:
    desc: "Run Node.js unit tests"
    cmds:
      - task: nodejs:test

  test-e2e:
    desc: "Run E2E tests against versioned artifacts"
    deps: [init-dirs, build-all]
    dir: ../development/nodejs
    cmds:
      - echo "Testing versioned artifacts at {{.ARTIFACT_DIR}}/web"
      - pnpm test:e2e

  verify:pty:
    desc: "Build PTY service bundle"
    cmds:
      - task: build-pty

  verify:xterm:
    desc: "Smoke test xterm.js integration (starts services briefly)"
    deps:
      - build-dotnet
    dir: ..
    cmds:
      - |
        bash -lc '
          if command -v timeout >/dev/null 2>&1; then
            timeout 45 ./scripts/verification/verify-integration.sh || true
          else
            ./scripts/verification/verify-integration.sh &
            pid=$!
            (
              sleep 45
              if kill -0 "$pid" 2>/dev/null; then
                kill "$pid" 2>/dev/null || true
              fi
            ) & watcher=$!
            wait "$pid" 2>/dev/null || true
            kill "$watcher" 2>/dev/null || true
          fi'

  verify:pty-keys:
    desc: "Start PTY server, send arrow/M/Q/Ctrl+C, parse logs"
    deps:
      - build-all
    cmds:
      - |
        set -euo pipefail
        ART_DIR="_artifacts/{{.VERSION}}"
        DIST="$ART_DIR/pty/dist"
        BIN="$ART_DIR/dotnet/bin"
        echo "Using artifacts at: $ART_DIR"
        # Ensure ws-send-keys is available in dist where ws is installed
        cp -f ../build/test-tools/ws-send-keys.js "$DIST/" || true
        # Start PTY server (robust PID capture)
        BIN_DIR="$BIN" nohup node "$DIST/server.js" > "$ART_DIR/_logs/pty-server.log" 2>&1 &
        srv_pid=$!
        # Fallback to pgrep if PID is not numeric (rare shells/jobcontrol quirks)
        if ! printf '%s' "$srv_pid" | grep -Eq '^[0-9]+$'; then
          srv_pid=$(pgrep -f "node .*$(basename "$DIST")/server.js" | head -n1 || true)
        fi
        printf '%s\n' "$srv_pid" > "$ART_DIR/_logs/pty-server.pid"
        sleep 1
        echo "PTY server PID: $(cat "$ART_DIR/_logs/pty-server.pid" | tr -cd '0-9\n')"
        # Send keys
        node "$DIST/ws-send-keys.js" || true
        # Stop server
        pid_to_kill="$(cat "$ART_DIR/_logs/pty-server.pid" | tr -cd '0-9\n')"
        if [ -n "$pid_to_kill" ]; then
          kill "$pid_to_kill" 2>/dev/null || true
        else
          pkill -f "node .*$(basename "$DIST")/server.js" 2>/dev/null || true
        fi
        sleep 1
        # Parse latest log
        LATEST_LOG=$(ls -t "$BIN/logs"/console-dungeon-*.log 2>/dev/null | head -1 || true)
        if [[ -n "${LATEST_LOG:-}" ]]; then
          echo "Latest log: $LATEST_LOG"
          node ../build/test-tools/parse-keylog.js "$LATEST_LOG"
        else
          echo "No log found in $BIN/logs"
        fi

  verify:pty-keys:dev:
    desc: "Dev mode: run PTY server against source Host Debug bin, send keys, parse source logs"
    deps:
      - build-all
    cmds:
      - |
        set -euo pipefail
        # Build ConsoleDungeon.Host in Debug to produce bin/Debug outputs
        pushd ../development/dotnet/console/src/host/ConsoleDungeon.Host >/dev/null
        dotnet build -c Debug
        SRC_BIN="$(pwd)/bin/Debug/net8.0"
        popd >/dev/null
        # Use latest artifact PTY server for consistency
        ART_DIR="_artifacts/{{.VERSION}}"
        DIST="$ART_DIR/pty/dist"
        echo "Using PTY from: $DIST"
        # Ensure ws-send-keys is available in dist where ws is installed
        cp -f ../build/test-tools/ws-send-keys.js "$DIST/" || true
        # Start PTY server with BIN_DIR pointing at source Debug bin (robust PID capture)
        BIN_DIR="$SRC_BIN" nohup node "$DIST/server.js" > "$ART_DIR/_logs/pty-server-dev.log" 2>&1 &
        srv_pid=$!
        if ! printf '%s' "$srv_pid" | grep -Eq '^[0-9]+$'; then
          srv_pid=$(pgrep -f "node .*$(basename "$DIST")/server.js" | head -n1 || true)
        fi
        printf '%s\n' "$srv_pid" > "$ART_DIR/_logs/pty-server-dev.pid"
        sleep 1
        echo "PTY server (dev) PID: $(cat "$ART_DIR/_logs/pty-server-dev.pid" | tr -cd '0-9\n')"
        # Send keys
        node "$DIST/ws-send-keys.js" || true
        # Stop server
        pid_to_kill="$(cat "$ART_DIR/_logs/pty-server-dev.pid" | tr -cd '0-9\n')"
        if [ -n "$pid_to_kill" ]; then
          kill "$pid_to_kill" 2>/dev/null || true
        else
          pkill -f "node .*$(basename "$DIST")/server.js" 2>/dev/null || true
        fi
        sleep 1
        # Parse latest source Debug log
        SRC_LOG_DIR="$SRC_BIN/logs"
        LATEST_LOG=$(ls -t "$SRC_LOG_DIR"/console-dungeon-*.log 2>/dev/null | head -1 || true)
        if [[ -n "${LATEST_LOG:-}" ]]; then
          echo "Latest source log: $LATEST_LOG"
          node ../build/test-tools/parse-keylog.js "$LATEST_LOG"
        else
          echo "No log found in $SRC_LOG_DIR"
        fi

  dev:start:
    desc: "Start all development services (PTY, docs-site, console) with PM2"
    dir: ../development/nodejs
    cmds:
      - echo "Starting development services with PM2..."
      - pm2 start ecosystem.config.js
      - pm2 save
      - echo "✅ All services started. Use 'task dev:status' to check status"
      - echo 'Note - Console uses ConsoleDungeon.Host (plugin-based architecture)'

  dev:stop:
    desc: "Stop all development services"
    dir: ../development/nodejs
    cmds:
      - pm2 stop all
      - echo "✅ All services stopped"

  dev:restart:
    desc: "Restart all development services"
    dir: ../development/nodejs
    cmds:
      - pm2 restart all
      - echo "✅ All services restarted"

  dev:status:
    desc: "Show status of all development services"
    dir: ../development/nodejs
    cmds:
      - pm2 list
      - echo ""
      - echo "=== Service URLs ==="
      - echo "Astro Web - http://localhost:4321/"
      - echo "Live Terminal (PTY) - http://localhost:4321/demo/"
      - echo "PTY Service - WebSocket on port 4041"
      - echo "Console Dungeon - Running via PTY service"

  dev:logs:
    desc: "Show logs for all development services"
    dir: ../development/nodejs
    cmds:
      - pm2 logs --lines 50

  capture:state:
    desc: "Capture complete application state for current version (screenshots, logs, terminal buffers)"
    dir: ../development/nodejs
    cmds:
      - echo "📸 Capturing versioned state for {{.VERSION}}..."
      - pnpm exec playwright test capture-versioned-state.spec.js --reporter=list
      - echo "✅ Artifacts saved to {{.ARTIFACT_DIR}}/web/"
      - echo "📁 Screenshots {{.ARTIFACT_DIR}}/web/screenshots/"
      - echo "📁 Terminal captures {{.ARTIFACT_DIR}}/web/terminal-captures/"
      - echo "📁 Verification logs {{.ARTIFACT_DIR}}/web/logs/"

  capture:quick:
    desc: "Quick state check without assertions (for rapid iteration)"
    dir: ../development/nodejs
    cmds:
      - pnpm exec playwright test check-dungeon-display.spec.js --reporter=list

  verify:visual:
    desc: "Run visual verification tests with assertions"
    dir: ../development/nodejs
    cmds:
      - pnpm exec playwright test verify-dungeon-gameplay.spec.js --reporter=list

  # ===============================================
  # BuildArcane integration (always use centralized build)
  # ===============================================
  arcane:ci:
    desc: "Run centralized BuildArcane CI (clean→restore→compile→test→pack/publish as configured)"
    dir: ..
    cmds:
      - |
        if ! command -v dotnet >/dev/null 2>&1; then
          echo "dotnet SDK not found in PATH" >&2; exit 1; fi
      - |
        if ! dotnet tool list | grep -q "lunar-build"; then
          echo "NOTE: 'lunar-build' dotnet tool not found. Install BuildArcane runner per plate-projects/build-arcane/README.md";
          echo "Example: dotnet tool install GiantCroissant.Plate.BuildArcane.Build.Runner";
        fi
      - dotnet lunar-build ci --config build-config.json

  arcane:compile:
    desc: "Build via BuildArcane only (no tests)"
    dir: ..
    cmds:
      - dotnet lunar-build compile --config build-config.json

  arcane:test:
    desc: "Run tests via BuildArcane (uses build-config.json)"
    dir: ..
    cmds:
      - dotnet lunar-build test --config build-config.json

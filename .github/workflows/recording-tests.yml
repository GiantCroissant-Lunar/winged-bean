name: Recording Tests (URF)

on:
  workflow_dispatch:
    inputs:
      record_duration:
        description: 'Recording duration in seconds'
        required: false
        default: '10'
        type: string
  push:
    branches:
      - main
    paths:
      - 'development/dotnet/console/**'
      - 'development/dotnet/windows/**'
      - 'development/dotnet/framework/**'
      - 'build/Taskfile.yml'
      - '.github/workflows/recording-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'development/dotnet/console/**'
      - 'development/dotnet/windows/**'
      - 'development/dotnet/framework/**'

jobs:
  build-and-test-console:
    name: Console Recording Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout plate-projects dependencies
        run: |
          cd ../../
          echo "Cloning plate-projects dependencies..."
          git clone https://github.com/GiantCroissant-Lunar/plugin-manoi.git plate-projects/plugin-manoi
          git clone https://github.com/GiantCroissant-Lunar/cross-milo.git plate-projects/cross-milo
          git clone https://github.com/GiantCroissant-Lunar/host-land.git plate-projects/host-land
          echo "✅ Dependencies cloned"
          ls -la plate-projects/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Task
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
          task --version

      - name: Build console app
        working-directory: build
        run: |
          echo "Building console version..."
          pushd ../development/dotnet/console/src/host/Dungeon.Host.Console
          dotnet build -c Debug
          CONSOLE_BIN="$(pwd)/bin/Debug/net8.0"
          popd

          # Copy to artifacts
          mkdir -p _artifacts/0.0.1-436/dotnet/console/bin
          cp -r ../development/dotnet/console/src/host/Dungeon.Host.Console/bin/Debug/net8.0/* \
               _artifacts/0.0.1-436/dotnet/console/bin/

          echo "✅ Console version built and copied"
          ls -la _artifacts/0.0.1-436/dotnet/console/bin/

      - name: Test console recording
        working-directory: build/_artifacts/0.0.1-436/dotnet/console/bin
        run: |
          DURATION="${{ inputs.record_duration || '10' }}"
          echo "Testing console recording for ${DURATION} seconds..."

          # Run recording test
          ./Dungeon.Host.Console \
            --record=true \
            --record-duration=${DURATION} \
            --record-session=ci-console-test \
            2>&1 | tee console-recording.log

          EXIT_CODE=${PIPESTATUS[0]}
          echo "Console app exit code: $EXIT_CODE"

          # Check if recording was successful
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Console app completed successfully"
          else
            echo "❌ Console app failed with exit code $EXIT_CODE"
            exit 1
          fi

      - name: Verify console recordings
        working-directory: build/_artifacts/0.0.1-436/dotnet
        run: |
          echo "Checking for recording files..."
          ls -lh recordings/ || echo "No recordings directory"

          if [ -d "recordings" ]; then
            RECORDING_COUNT=$(find recordings -name "*.cast" -o -name "*.urf.jsonl" | wc -l)
            echo "Found $RECORDING_COUNT recording files"

            if [ $RECORDING_COUNT -gt 0 ]; then
              echo "✅ Recording files created"
              find recordings -name "*.cast" -o -name "*.urf.jsonl" -exec ls -lh {} \;

              # Show first recording file content (metadata)
              echo "--- Sample recording metadata ---"
              find recordings -name "*.cast" -exec head -1 {} \; | head -1
            else
              echo "⚠️ No recording files found"
            fi
          else
            echo "⚠️ No recordings directory created"
          fi

      - name: Upload console recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-recordings
          path: |
            build/_artifacts/0.0.1-436/dotnet/recordings/
            build/_artifacts/0.0.1-436/dotnet/console/bin/console-recording.log
          retention-days: 7

      - name: Upload console logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-logs
          path: build/_artifacts/0.0.1-436/dotnet/console/bin/logs/
          retention-days: 3

  build-and-test-desktop:
    name: Desktop Recording Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout plate-projects dependencies
        run: |
          cd ../../
          echo "Cloning plate-projects dependencies..."
          git clone https://github.com/GiantCroissant-Lunar/plugin-manoi.git plate-projects/plugin-manoi
          git clone https://github.com/GiantCroissant-Lunar/cross-milo.git plate-projects/cross-milo
          git clone https://github.com/GiantCroissant-Lunar/host-land.git plate-projects/host-land
          echo "✅ Dependencies cloned"
          ls -la plate-projects/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Task
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
          task --version

      - name: Build desktop app and plugins
        working-directory: build
        run: |
          echo "Building desktop version..."
          pushd ../development/dotnet/windows/src/host/Dungeon.Host.SadConsole
          dotnet build -c Debug
          DESKTOP_BIN="$(pwd)/bin/Debug/net8.0"
          popd

          # Copy to artifacts
          mkdir -p _artifacts/0.0.1-436/dotnet/desktop/bin
          cp -r ../development/dotnet/windows/src/host/Dungeon.Host.SadConsole/bin/Debug/net8.0/* \
               _artifacts/0.0.1-436/dotnet/desktop/bin/

          # Copy correct SadConsole plugin manifest
          cp ../development/dotnet/windows/src/plugins/WingedBean.Plugins.SadConsole/WingedBean.Plugins.SadConsole.plugin.json \
             _artifacts/0.0.1-436/dotnet/desktop/bin/plugins/

          # Copy Recorder.Snapshots plugin
          mkdir -p _artifacts/0.0.1-436/dotnet/desktop/bin/plugins
          cp ../development/dotnet/windows/src/plugins/WingedBean.Plugins.Recorder.Snapshots/bin/Debug/net8.0/WingedBean.Plugins.Recorder.Snapshots.dll \
             _artifacts/0.0.1-436/dotnet/desktop/bin/plugins/

          echo "✅ Desktop version built and copied"
          ls -la _artifacts/0.0.1-436/dotnet/desktop/bin/

      - name: Test desktop recording (headless)
        working-directory: build/_artifacts/0.0.1-436/dotnet/desktop/bin
        run: |
          DURATION="${{ inputs.record_duration || '10' }}"
          echo "Testing desktop recording for ${DURATION} seconds (headless)..."

          # Set headless environment
          export SDL_VIDEODRIVER=dummy
          export DISPLAY=:99

          # Run recording test (may fail in CI without GUI, but we test the recording logic)
          ./Dungeon.Host.SadConsole \
            --record=true \
            --record-duration=${DURATION} \
            --record-session=ci-desktop-test \
            2>&1 | tee desktop-recording.log || echo "Desktop app failed (expected in headless CI)"

          # Check if at least the recording service started
          if grep -q "Recording requested" desktop-recording.log; then
            echo "✅ Recording service activated"
          else
            echo "⚠️ Recording service may not have started"
          fi

      - name: Verify desktop recordings
        working-directory: build/_artifacts/0.0.1-436/dotnet/desktop/bin
        run: |
          echo "Checking for recording files..."
          ls -lh recordings/urf/ || echo "No recordings/urf directory"

          if [ -d "recordings/urf" ]; then
            RECORDING_COUNT=$(find recordings/urf -name "*.cast" -o -name "*.urf.jsonl" | wc -l)
            echo "Found $RECORDING_COUNT recording files"

            if [ $RECORDING_COUNT -gt 0 ]; then
              echo "✅ Recording files created"
              find recordings/urf -name "*.cast" -o -name "*.urf.jsonl" -exec ls -lh {} \;

              # Show recording metadata
              echo "--- Sample recording metadata ---"
              find recordings/urf -name "*.urf.jsonl" -exec head -1 {} \; | head -1
            else
              echo "⚠️ No recording files found (may be expected in headless CI)"
            fi
          else
            echo "⚠️ No recordings directory created (may be expected in headless CI)"
          fi

      - name: Upload desktop recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-recordings
          path: |
            build/_artifacts/0.0.1-436/dotnet/desktop/bin/recordings/
            build/_artifacts/0.0.1-436/dotnet/desktop/bin/desktop-recording.log
          retention-days: 7

      - name: Upload desktop logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-logs
          path: build/_artifacts/0.0.1-436/dotnet/desktop/bin/logs/
          retention-days: 3

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [build-and-test-console, build-and-test-desktop]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate summary
        run: |
          echo "## 🎬 Recording Tests Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Console status
          if [ -d "console-recordings" ]; then
            CONSOLE_FILES=$(find console-recordings -name "*.cast" -o -name "*.urf.jsonl" 2>/dev/null | wc -l)
            if [ $CONSOLE_FILES -gt 0 ]; then
              echo "✅ **Console Recording**: $CONSOLE_FILES files created" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ **Console Recording**: No files created" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "❌ **Console Recording**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          # Desktop status
          if [ -d "desktop-recordings" ]; then
            DESKTOP_FILES=$(find desktop-recordings -name "*.cast" -o -name "*.urf.jsonl" 2>/dev/null | wc -l)
            if [ $DESKTOP_FILES -gt 0 ]; then
              echo "✅ **Desktop Recording**: $DESKTOP_FILES files created" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ **Desktop Recording**: No files created (may be expected in CI)" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "❌ **Desktop Recording**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Console recordings and logs" >> $GITHUB_STEP_SUMMARY
          echo "- Desktop recordings and logs" >> $GITHUB_STEP_SUMMARY

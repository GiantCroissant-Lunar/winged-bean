# Pre-commit hooks for WingedBean Console
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Code Formatters
  - repo: local
    hooks:
      # Format C# code with dotnet format
      - id: dotnet-format
        name: Format C# code
        entry: dotnet format
        args: [--include]
        language: system
        files: \.cs$
        pass_filenames: true

      # JetBrains CleanupCode (optional, only if jb CLI is installed)
      - id: jb-cleanupcode
        name: JetBrains CleanupCode
        entry: bash
        args:
          - -c
          - |
            if command -v jb &> /dev/null; then
              # Find solution file
              SOLUTION=$(find . -maxdepth 3 -name "*.sln" | head -1)
              if [ -n "$SOLUTION" ]; then
                echo "Running JetBrains CleanupCode on $SOLUTION"
                jb cleanupcode "$SOLUTION" --profile="Built-in: Full Cleanup" --exclude-generated
              else
                echo "No solution file found, skipping"
              fi
            else
              echo "jb CLI not installed, skipping JetBrains CleanupCode"
            fi
        language: system
        files: \.cs$
        pass_filenames: false

  # Plate Validators (when published)
  # - repo: https://github.com/giantcroissant/plate-validators
  #   rev: v2.0.0
  #   hooks:
  #     # Format C# code
  #     - id: format-dotnet
  #
  #     # Optional: JetBrains CleanupCode
  #     - id: format-jb
  #       args: [--profile=Built-in: Full Cleanup]
  #
  #     # Validate namespaces
  #     - id: check-namespace-enhanced
  #       args: [--namespace-prefix=WingedBean]
  #
  #     # Validate .csproj files
  #     - id: validate-csproj
  #
  #     # Check circular dependencies
  #     - id: check-circular-deps

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: mixed-line-ending
        args: [--fix=lf]

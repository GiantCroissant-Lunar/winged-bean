version: '3'

tasks:
  build:
    desc: "Build Desktop (SadConsole) version"
    cmds:
      - echo "Building SadConsole plugin..."
      - dotnet build src/plugins/WingedBean.Plugins.SadConsole/WingedBean.Plugins.SadConsole.csproj
      - echo "Building DungeonGame gameplay plugin..."
      - dotnet build ../console/src/plugins/WingedBean.Plugins.DungeonGame/WingedBean.Plugins.DungeonGame.csproj
      - echo "Building Dungeon.Host.SadConsole..."
      - dotnet build src/host/Dungeon.Host.SadConsole/Dungeon.Host.SadConsole.csproj

  run:
    desc: "Run Desktop (SadConsole) version"
    cmds:
      - dotnet run --project src/host/Dungeon.Host.SadConsole/Dungeon.Host.SadConsole.csproj

  clean:
    desc: "Clean Desktop build artifacts"
    cmds:
      - dotnet clean src/plugins/WingedBean.Plugins.SadConsole/WingedBean.Plugins.SadConsole.csproj
      - dotnet clean src/host/Dungeon.Host.SadConsole/Dungeon.Host.SadConsole.csproj

  test:
    desc: "Run Desktop tests (if any)"
    cmds:
      - echo "No desktop-specific tests yet"
